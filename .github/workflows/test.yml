name: Repository tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-sandbox:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Prepare Codex sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict

      - name: Install Codex
        shell: bash
        run: curl -fsSL https://chatgpt.com/codex/install.sh | sh

      - name: Verify Codex sandbox
        shell: bash
        run: |
          set -euo pipefail
          test "$(readlink -f "$(command -v bwrap)")" = /usr/bin/bwrap
          bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true
          codex sandbox -- /usr/bin/true

  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install Worker dependencies
        shell: bash
        run: npm ci --prefix apps/chatgpt-app

      - name: Build workbench UI
        run: npm run build:ui --prefix apps/chatgpt-app

      - name: Install Agent runtime dependencies
        run: npm ci --prefix .github/actions/agent-runtime

      - name: Install event delivery dependencies
        run: npm ci --prefix apps/event-delivery

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          shellcheck --version
          ./actionlint -version

      - name: Lint GitHub Actions workflows
        shell: bash
        run: ./actionlint -color

      - name: Type-check Worker and shared runtime source
        working-directory: apps/chatgpt-app
        run: npm run typecheck

      - name: Test TypeScript source
        shell: bash
        run: node --test tests/*.test.ts

      - name: Type-check Agent runtime and tests
        working-directory: .github/actions/agent-runtime
        run: npx tsc --noEmit

      - name: Type-check event delivery source and tests
        run: apps/chatgpt-app/node_modules/.bin/tsc --noEmit -p apps/event-delivery
