name: Repository tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Worker dependencies
        shell: bash
        run: npm ci --prefix apps/chatgpt-app

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          shellcheck --version
          ./actionlint -version

      - name: Lint GitHub Actions workflows
        shell: bash
        run: ./actionlint -color

      - name: ShellCheck scripts and tests
        shell: bash
        run: shellcheck --severity=warning tests/*.sh

      - name: Test workflow security contract
        shell: bash
        run: bash tests/workflow-security.test.sh

      - name: Type-check Worker JavaScript
        shell: bash
        run: npm --prefix apps/chatgpt-app run typecheck

      - name: Test Node actions
        shell: bash
        run: node --test tests/*.test.js
