name: Codex auth

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Codex
        shell: bash
        run: curl -fsSL https://chatgpt.com/codex/install.sh | sh

      - name: Configure Codex
        shell: bash
        env:
          MINI_CODEX_BASE_URL: ${{ secrets.MINI_CODEX_BASE_URL }}
        run: |
          install -d -m 0700 "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<EOF
          model = "gpt-5.6-sol"
          model_provider = "mini_codex"

          [model_providers.mini_codex]
          name = "Mini Codex"
          base_url = "$MINI_CODEX_BASE_URL"
          wire_api = "responses"
          env_key = "MINI_END_USER_KEY"
          EOF
          chmod 600 "$HOME/.codex/config.toml"

      - name: Verify Codex authentication
        shell: bash
        env:
          MINI_END_USER_KEY: ${{ secrets.MINI_END_USER_KEY }}
        run: codex exec --ephemeral --skip-git-repo-check --sandbox read-only "Reply exactly OK." > /dev/null
