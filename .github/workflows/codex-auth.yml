name: Codex auth

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --prefix .github/actions/agent-runtime --omit=dev
      - name: Install Codex
        shell: bash
        run: curl -fsSL https://chatgpt.com/codex/install.sh | sh

      - name: Verify Codex authentication
        shell: bash
        env:
          MINI_END_USER_KEY: ${{ secrets.MINI_END_USER_KEY }}
          MINI_CODEX_BASE_URL: ${{ secrets.MINI_CODEX_BASE_URL }}
        run: node .github/actions/agent-runtime/auth-probe.ts codex
