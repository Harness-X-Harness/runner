name: Bounded Environment
run-name: ${{ inputs.environment_id }}

on:
  workflow_dispatch:
    inputs:
      environment_id:
        description: Opaque Environment identity
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  environment:
    name: Environment
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ENVIRONMENT_ID: ${{ inputs.environment_id }}
      TASK_CONTROL_PLANE_URL: ${{ vars.TASK_CONTROL_PLANE_URL }}
    steps:
      - name: Check out trusted runtime
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install runtime dependencies
        run: npm ci --prefix .github/actions/agent-runtime --omit=dev

      - name: Claim Environment
        id: claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/actions/agent-runtime/environment-entry.ts claim

      - name: Install Codex
        if: steps.claim.outputs.executor == 'codex'
        run: curl -fsSL https://chatgpt.com/codex/install.sh | sh

      - name: Install Grok
        if: steps.claim.outputs.executor == 'grok'
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Serve Environment
        if: steps.claim.outputs.executor != ''
        env:
          MINI_END_USER_KEY: ${{ secrets.MINI_END_USER_KEY }}
          MINI_CODEX_BASE_URL: ${{ secrets.MINI_CODEX_BASE_URL }}
          MINI_GROK_BASE_URL: ${{ secrets.MINI_GROK_BASE_URL }}
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: node .github/actions/agent-runtime/environment-entry.ts serve
