name: Bounded Environment
run-name: ${{ inputs.environment_id }}

on:
  workflow_dispatch:
    inputs:
      environment_id:
        description: Opaque Environment identity
        type: string
        required: true
      restore_runner_home:
        description: Overlay the owner's private T3 HOME for this dispatch (also enabled by repo variable T3_RESTORE_RUNNER_HOME)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  environment:
    name: Environment
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ENVIRONMENT_ID: ${{ inputs.environment_id }}
      TASK_CONTROL_PLANE_URL: ${{ vars.TASK_CONTROL_PLANE_URL }}
    steps:
      - name: Check out trusted runtime
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install runtime dependencies
        run: npm ci --prefix .github/actions/agent-runtime --omit=dev

      - name: Claim Environment
        id: claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/actions/agent-runtime/environment-entry.ts claim

      - name: Prepare Codex sandbox
        if: steps.claim.outputs.executor == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict

      - name: Install Codex
        if: steps.claim.outputs.executor == 'codex'
        run: curl -fsSL https://chatgpt.com/codex/install.sh | sh

      - name: Verify Codex sandbox
        if: steps.claim.outputs.executor == 'codex'
        shell: bash
        run: |
          set -euo pipefail
          test "$(readlink -f "$(command -v bwrap)")" = /usr/bin/bwrap
          bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true
          codex sandbox -- /usr/bin/true

      - name: Install Grok
        if: steps.claim.outputs.executor == 'grok'
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Preinstall T3 agent CLIs
        if: steps.claim.outputs.executor == 't3'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          curl -fsSL https://x.ai/cli/install.sh | bash
          curl -fsSL https://claude.ai/install.sh | bash
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          npm install --global --prefix "$HOME/.local" --ignore-scripts @earendil-works/pi-coding-agent@latest
          export PATH="$HOME/.local/bin:$HOME/.grok/bin:$PATH"
          codex --version
          grok --version
          claude --version
          agy --version
          pi --version

      - name: Install T3 service
        if: steps.claim.outputs.executor == 't3'
        shell: bash
        env:
          T3CODE_CHANNEL: stable
          T3CODE_VERSION: ${{ vars.T3CODE_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL https://t3.codes/install.sh | sh
          test -x "$HOME/.local/bin/t3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/t3" --version
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared noble main' | sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends cloudflared

      - name: Prepare T3 browser
        if: steps.claim.outputs.executor == 't3'
        shell: bash
        run: |
          set -euo pipefail
          # sudo drops PATH; keep the runner PATH so this finds ~/.local/bin/t3
          # and setup attributes T3's home to SUDO_USER, not root.
          sudo env "PATH=$PATH" t3 browser setup
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" == "1" ]]; then
            test -s /etc/apparmor.d/t3-chrome-headless-shell
          fi

      # Only the verified owner may enable this; routine open_environment dispatches only environment_id.
      # Restore AFTER the browser setup and BEFORE T3 starts; secrets never enter Serve.
      - name: Restore runner home state
        if: (inputs.restore_runner_home || vars.T3_RESTORE_RUNNER_HOME == 'true') && github.actor_id == '490285' && steps.claim.outputs.executor == 't3'
        env:
          T3_RUNNER_STORE_REPOSITORY: ${{ secrets.T3_RUNNER_STORE_REPOSITORY }}
          T3_RUNNER_STORE_TOKEN: ${{ secrets.T3_RUNNER_STORE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sqlite3 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends sqlite3
          fi
          node .github/actions/agent-runtime/home-state-cli.ts restore
          # Background checkpoints run with a minimal separate environment. The
          # store token is not passed to Serve or any T3/provider subprocess.
          node .github/actions/agent-runtime/home-state-cli.ts checkpoint-start

      - name: Serve Environment
        if: steps.claim.outputs.executor != ''
        env:
          MINI_END_USER_KEY: ${{ secrets.MINI_END_USER_KEY }}
          MINI_CODEX_BASE_URL: ${{ secrets.MINI_CODEX_BASE_URL }}
          MINI_GROK_BASE_URL: ${{ secrets.MINI_GROK_BASE_URL }}
          GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        run: node .github/actions/agent-runtime/environment-entry.ts serve

      - name: Publish runner home state
        if: always() && (inputs.restore_runner_home || vars.T3_RESTORE_RUNNER_HOME == 'true') && github.actor_id == '490285' && steps.claim.outputs.executor == 't3'
        env:
          T3_RUNNER_STORE_REPOSITORY: ${{ secrets.T3_RUNNER_STORE_REPOSITORY }}
          T3_RUNNER_STORE_TOKEN: ${{ secrets.T3_RUNNER_STORE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/actions/agent-runtime/home-state-cli.ts checkpoint-stop || true
          # Serializes with any in-flight periodic checkpoint.
          flock --exclusive --wait 120 "$RUNNER_TEMP/t3-home-checkpoint-lock" \
            node .github/actions/agent-runtime/home-state-cli.ts publish
