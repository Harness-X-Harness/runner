name: Private Development Environment

on:
  workflow_dispatch:
run-name: Private environment · #${{ github.run_number }}

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-24.04
    environment: session--none
    env:
      LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
      LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
      LARK_CHAT_NAME: ${{ secrets.LARK_CHAT_NAME }}
      MINI_END_USER_KEY: ${{ secrets.MINI_END_USER_KEY }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: ./.github/actions/development-tools

      - name: Configure Mini executors
        shell: bash
        env:
          MINI_CODEX_BASE_URL: ${{ secrets.MINI_CODEX_BASE_URL }}
          MINI_GROK_BASE_URL: ${{ secrets.MINI_GROK_BASE_URL }}
        run: |
          install -d -m 0700 "$HOME/.codex" "$HOME/.grok"
          printf 'model = "gpt-5.6-sol"\nmodel_provider = "mini_codex"\n\n[model_providers.mini_codex]\nname = "Mini Codex"\nbase_url = "%s"\nwire_api = "responses"\nenv_key = "MINI_END_USER_KEY"\n' \
            "$MINI_CODEX_BASE_URL" > "$HOME/.codex/config.toml"
          printf '[models]\ndefault = "mini-grok-4-6"\n\n[model.mini-grok-4-6]\nmodel = "grok-4.6"\nbase_url = "%s"\nname = "Mini Grok 4.6"\ndescription = "Grok through Mini"\nenv_key = "MINI_END_USER_KEY"\napi_backend = "responses"\n' \
            "$MINI_GROK_BASE_URL" > "$HOME/.grok/config.toml"
          chmod 600 "$HOME/.codex/config.toml" "$HOME/.grok/config.toml"

      - uses: ./.github/actions/private-network
        with:
          headscale-url: ${{ secrets.HEADSCALE_URL }}
          auth-key: ${{ secrets.HEADSCALE_AUTHKEY }}

      - uses: ./.github/actions/t3-session

      - uses: ./.github/actions/lark-send

      - name: Keep environment running
        shell: bash
        run: sleep infinity
