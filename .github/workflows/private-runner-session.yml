name: Private Development Environment

on:
  workflow_dispatch:
    inputs:
      environment_id:
        description: Opaque control-plane Environment identity.
        required: true
        type: string
      environment_owner:
        description: Opaque owner concurrency slot.
        required: true
        type: string
run-name: Private environment · #${{ github.run_number }}

concurrency:
  group: private-environment-${{ inputs.environment_owner }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  session:
    runs-on: ubuntu-24.04
    environment: session--none
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/environment-control
        with:
          control-plane-url: ${{ vars.TASK_CONTROL_PLANE_URL }}
          environment-id: ${{ inputs.environment_id }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: ./.github/actions/development-tools

      - name: Configure Mini executors
        shell: bash
        env:
          MINI_END_USER_KEY: ${{ secrets.MINI_END_USER_KEY }}
          MINI_CODEX_BASE_URL: ${{ secrets.MINI_CODEX_BASE_URL }}
          MINI_GROK_BASE_URL: ${{ secrets.MINI_GROK_BASE_URL }}
        run: |
          echo "MINI_END_USER_KEY=$MINI_END_USER_KEY" >> "$GITHUB_ENV"
          install -d -m 0700 "$HOME/.codex" "$HOME/.grok"
          cat > "$HOME/.codex/config.toml" <<EOF
          model = "gpt-5.6-sol"
          model_provider = "mini_codex"

          [model_providers.mini_codex]
          name = "Mini Codex"
          base_url = "$MINI_CODEX_BASE_URL"
          wire_api = "responses"
          env_key = "MINI_END_USER_KEY"
          EOF
          cat > "$HOME/.grok/config.toml" <<EOF
          [models]
          default = "mini-grok-4-6"

          [model.mini-grok-4-6]
          model = "grok-4.6"
          base_url = "$MINI_GROK_BASE_URL"
          name = "Mini Grok 4.6"
          description = "Grok through Mini"
          env_key = "MINI_END_USER_KEY"
          api_backend = "responses"
          EOF
          chmod 600 "$HOME/.codex/config.toml" "$HOME/.grok/config.toml"

      - name: Join the optional private network
        continue-on-error: true
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          authkey: ${{ secrets.HEADSCALE_AUTHKEY }}
          hostname: gha-${{ github.run_id }}-${{ github.run_attempt }}
          args: --login-server=${{ secrets.HEADSCALE_URL }} --accept-dns=false --ssh
          version: latest

      - uses: ./.github/actions/t3-session

      - uses: ./.github/actions/session-runtime
        with:
          control-plane-url: ${{ vars.TASK_CONTROL_PLANE_URL }}
          environment-id: ${{ inputs.environment_id }}
