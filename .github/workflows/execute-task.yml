name: Execute code task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Control-plane task identifier
        required: true
        type: string
      repo:
        description: Target repository in owner/repository form
        required: true
        type: string
      ref:
        description: Branch, tag, or commit to check out
        required: true
        type: string
      executor:
        description: Coding executor
        required: true
        type: choice
        options:
          - codex
          - claude
          - grok
      mode:
        description: How changes should be delivered
        required: true
        type: choice
        options:
          - analyze
          - edit
          - pull_request
      repository_access:
        description: Verified target repository access path
        required: true
        type: choice
        options:
          - public_read
          - installation
run-name: Code task · ${{ inputs.task_id }}

permissions:
  contents: read
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    env:
      TASK_ID: ${{ inputs.task_id }}
      TARGET_REPO: ${{ inputs.repo }}
      TARGET_REF: ${{ inputs.ref }}
      EXECUTOR: ${{ inputs.executor }}
      TASK_MODE: ${{ inputs.mode }}
      TASK_CONTROL_PLANE_URL: ${{ vars.TASK_CONTROL_PLANE_URL }}
      WORKSPACE: ${{ github.workspace }}/target-workspace

    steps:
      - name: Check out runner workflow
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Resolve target repository
        if: ${{ inputs.repository_access == 'installation' }}
        id: target
        shell: bash
        run: |
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Create target repository token
        if: ${{ inputs.repository_access == 'installation' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RUNNER_GITHUB_APP_ID }}
          private-key: ${{ secrets.RUNNER_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}

      - name: Reject write through public read
        if: ${{ inputs.repository_access == 'public_read' && inputs.mode != 'analyze' }}
        shell: bash
        run: exit 1

      - name: Check out installed target repository
        if: ${{ inputs.repository_access == 'installation' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-workspace
          persist-credentials: false

      - name: Check out public target repository
        if: ${{ inputs.repository_access == 'public_read' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target-workspace
          persist-credentials: false

      - name: Report running
        uses: ./.github/actions/task-control
        with:
          operation: event
          control-plane-url: ${{ env.TASK_CONTROL_PLANE_URL }}
          task-id: ${{ env.TASK_ID }}
          status: running
          run-id: ${{ github.run_id }}

      - name: Fetch private task prompt
        uses: ./.github/actions/task-control
        with:
          operation: fetch
          control-plane-url: ${{ env.TASK_CONTROL_PLANE_URL }}
          task-id: ${{ env.TASK_ID }}
          output-file: ${{ runner.temp }}/task.prompt

      - name: Prepare executor result
        shell: bash
        run: install -m 0600 /dev/null "$RUNNER_TEMP/executor.result"

      - name: Install Codex
        if: ${{ inputs.executor == 'codex' }}
        shell: bash
        run: curl -fsSL https://chatgpt.com/codex/install.sh | sh

      - name: Configure Codex
        if: ${{ inputs.executor == 'codex' }}
        shell: bash
        env:
          MINI_CODEX_BASE_URL: ${{ secrets.MINI_CODEX_BASE_URL }}
        run: |
          install -d -m 0700 "$HOME/.codex"
          printf 'model = "gpt-5.6-sol"\nmodel_provider = "mini_codex"\n\n[model_providers.mini_codex]\nname = "Mini Codex"\nbase_url = "%s"\nwire_api = "responses"\nenv_key = "MINI_END_USER_KEY"\n' \
            "$MINI_CODEX_BASE_URL" > "$HOME/.codex/config.toml"
          chmod 600 "$HOME/.codex/config.toml"

      - name: Run Codex
        if: ${{ inputs.executor == 'codex' }}
        uses: ./.github/actions/task-driver
        with:
          executor: codex
          prompt-file: ${{ runner.temp }}/task.prompt
          result-file: ${{ runner.temp }}/executor.result
          working-directory: ${{ env.WORKSPACE }}
          control-plane-url: ${{ env.TASK_CONTROL_PLANE_URL }}
          task-id: ${{ env.TASK_ID }}
        env:
          MINI_END_USER_KEY: ${{ secrets.MINI_END_USER_KEY }}

      - name: Install Claude Code
        if: ${{ inputs.executor == 'claude' }}
        shell: bash
        run: curl -fsSL https://claude.ai/install.sh | bash

      - name: Run Claude Code
        if: ${{ inputs.executor == 'claude' }}
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: target-workspace
        run: claude --dangerously-skip-permissions -p "$(< "$RUNNER_TEMP/task.prompt")" > "$RUNNER_TEMP/executor.result"

      - name: Install Grok Build
        if: ${{ inputs.executor == 'grok' }}
        shell: bash
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Configure Grok Build
        if: ${{ inputs.executor == 'grok' }}
        shell: bash
        env:
          MINI_GROK_BASE_URL: ${{ secrets.MINI_GROK_BASE_URL }}
        run: |
          install -d -m 0700 "$HOME/.grok"
          printf '[models]\ndefault = "mini-grok-4-6"\n\n[model.mini-grok-4-6]\nmodel = "grok-4.6"\nbase_url = "%s"\nname = "Mini Grok 4.6"\ndescription = "Grok through Mini"\nenv_key = "MINI_END_USER_KEY"\napi_backend = "responses"\n' \
            "$MINI_GROK_BASE_URL" > "$HOME/.grok/config.toml"
          chmod 600 "$HOME/.grok/config.toml"

      - name: Run Grok Build
        if: ${{ inputs.executor == 'grok' }}
        uses: ./.github/actions/task-driver
        with:
          executor: grok
          prompt-file: ${{ runner.temp }}/task.prompt
          result-file: ${{ runner.temp }}/executor.result
          working-directory: ${{ env.WORKSPACE }}
          control-plane-url: ${{ env.TASK_CONTROL_PLANE_URL }}
          task-id: ${{ env.TASK_ID }}
        env:
          MINI_END_USER_KEY: ${{ secrets.MINI_END_USER_KEY }}

      - name: Report testing
        uses: ./.github/actions/task-control
        with:
          operation: event
          control-plane-url: ${{ env.TASK_CONTROL_PLANE_URL }}
          task-id: ${{ env.TASK_ID }}
          status: testing

      - name: Check task diff
        shell: bash
        run: git -C "$WORKSPACE" diff --check

      - name: Detect task changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git -C "$WORKSPACE" status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start task branch
        if: ${{ inputs.mode != 'analyze' && steps.changes.outputs.changed == 'true' }}
        shell: bash
        working-directory: target-workspace
        run: git switch -c "task/$TASK_ID"

      - name: Report committing
        if: ${{ inputs.mode != 'analyze' && steps.changes.outputs.changed == 'true' }}
        uses: ./.github/actions/task-control
        with:
          operation: event
          control-plane-url: ${{ env.TASK_CONTROL_PLANE_URL }}
          task-id: ${{ env.TASK_ID }}
          status: committing

      - name: Commit task changes
        if: ${{ inputs.mode != 'analyze' && steps.changes.outputs.changed == 'true' }}
        shell: bash
        working-directory: target-workspace
        run: |
          git config user.name "harness-x-harness-task-runner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Execute code task $TASK_ID"

      - name: Push task branch
        if: ${{ inputs.mode != 'analyze' && steps.changes.outputs.changed == 'true' }}
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: target-workspace
        run: |
          git config credential.helper "store --file=$RUNNER_TEMP/target-repo-credential"
          printf 'protocol=https\nhost=github.com\npath=%s.git\nusername=x-access-token\npassword=%s\n\n' \
            "$TARGET_REPO" "$TARGET_TOKEN" | git credential approve
          git push origin "task/$TASK_ID"

      - name: Open pull request
        if: ${{ inputs.mode == 'pull_request' && steps.changes.outputs.changed == 'true' }}
        id: pull-request
        shell: bash
        env:
          TARGET_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          response="$(curl -fsSL -X POST \
            "https://api.github.com/repos/$TARGET_REPO/pulls" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TARGET_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg title "Execute code task $TASK_ID" --arg head "task/$TASK_ID" --arg base "$TARGET_REF" \
              '{title:$title,head:$head,base:$base,body:"Created by the Harness X Harness Task Runner."}')")"
          echo "url=$(jq -r .html_url <<<"$response")" >> "$GITHUB_OUTPUT"

      - name: Report completed
        if: ${{ success() }}
        shell: bash
        run: |
          commit="$(git -C "$WORKSPACE" rev-parse HEAD)"
          changed="${{ steps.changes.outputs.changed }}"
          branch=""
          summary="$(< "$RUNNER_TEMP/executor.result")"
          if [[ "$TASK_MODE" != "analyze" && "$changed" == "true" ]]; then
            branch="task/$TASK_ID"
          fi
          jq -n \
            --arg commit "$commit" \
            --arg branch "$branch" \
            --arg summary "$summary" \
            --arg pullRequest "${{ steps.pull-request.outputs.url }}" \
            '{commit:$commit,summary:$summary} + (if $branch == "" then {} else {branch:$branch} end) + (if $pullRequest == "" then {} else {pullRequest:$pullRequest} end)' \
            > "$RUNNER_TEMP/task.result.json"

      - name: Publish completed
        if: ${{ success() }}
        uses: ./.github/actions/task-control
        with:
          operation: event
          control-plane-url: ${{ env.TASK_CONTROL_PLANE_URL }}
          task-id: ${{ env.TASK_ID }}
          status: completed
          result-file: ${{ runner.temp }}/task.result.json

      - name: Report failed
        if: ${{ failure() }}
        uses: ./.github/actions/task-control
        with:
          operation: event
          control-plane-url: ${{ env.TASK_CONTROL_PLANE_URL }}
          task-id: ${{ env.TASK_ID }}
          status: failed

      - name: Report cancelled
        if: ${{ cancelled() }}
        uses: ./.github/actions/task-control
        with:
          operation: event
          control-plane-url: ${{ env.TASK_CONTROL_PLANE_URL }}
          task-id: ${{ env.TASK_ID }}
          status: cancelled
