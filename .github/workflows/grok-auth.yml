name: Grok auth

on:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * *"

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Grok Build
        shell: bash
        run: curl -fsSL https://x.ai/cli/install.sh | bash

      - name: Configure Grok Build
        shell: bash
        env:
          MINI_GROK_BASE_URL: ${{ secrets.MINI_GROK_BASE_URL }}
        run: |
          install -d -m 0700 "$HOME/.grok"
          cat > "$HOME/.grok/config.toml" <<EOF
          [models]
          default = "mini-grok-4-6"

          [model.mini-grok-4-6]
          model = "grok-4.6"
          base_url = "$MINI_GROK_BASE_URL"
          name = "Mini Grok 4.6"
          description = "Grok through Mini"
          env_key = "MINI_END_USER_KEY"
          api_backend = "responses"
          EOF
          chmod 600 "$HOME/.grok/config.toml"

      - name: Verify Grok authentication
        shell: bash
        env:
          MINI_END_USER_KEY: ${{ secrets.MINI_END_USER_KEY }}
        run: grok --no-auto-update --always-approve -m mini-grok-4-6 -p "Reply exactly OK." > /dev/null
